[workspace]
members = [
  "crates/attestation-cli",
  "crates/attestation-types",
  "crates/attestation-circuit",
  "crates/lez-compat",
  "crates/tokenstudio-config",
]
resolver = "2"

[workspace.package]
authors = ["FidelCoder"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FidelCoder/LEZ-TokenStudio"
version = "0.1.0"

[workspace.dependencies]
attestation-types = { path = "crates/attestation-types" }
attestation-circuit = { path = "crates/attestation-circuit" }
lez-compat = { path = "crates/lez-compat" }
tokenstudio-config = { path = "crates/tokenstudio-config" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
thiserror = "2"
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
risc0-build = "3.0.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
