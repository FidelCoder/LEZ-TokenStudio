[workspace]
members = [
  "crates/attestation-prover",
  "crates/attestation-verifier",
  "guests/balance-attestation",
  "crates/attestation-cli",
  "crates/attestation-types",
  "crates/attestation-circuit",
  "crates/lez-compat",
  "crates/tokenstudio-config",
]
exclude = ["guests/balance-attestation/guest"]
resolver = "2"

[workspace.package]
authors = ["FidelCoder"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FidelCoder/LEZ-TokenStudio"
version = "0.1.0"

[workspace.dependencies]
attestation-types = { path = "crates/attestation-types" }
attestation-prover = { path = "crates/attestation-prover" }
attestation-verifier = { path = "crates/attestation-verifier" }
balance-attestation-methods = { path = "guests/balance-attestation" }
attestation-circuit = { path = "crates/attestation-circuit" }
lez-compat = { path = "crates/lez-compat" }
tokenstudio-config = { path = "crates/tokenstudio-config" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bincode = "1.3"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
jsonrpsee = { version = "=0.26.0", features = ["http-client"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "client"] }
risc0-build = "=3.0.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
